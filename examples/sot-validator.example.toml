# Example sot-validator fleet configuration.
#
# Pass it to any command with `sot-validator --config <file> <command>`, or load
# it with sot_validator.config.load_config(path). Every site owns one
# 10.x.0.0/16 block, and active probing is scoped to its listed /24 subnets.
# Unknown keys are rejected.
#
# Secrets (vCenter passwords, SNMP communities, Proxmox token secrets) must be
# written as ${env:NAME} references; literal secrets are refused at load time,
# but the variable is only read from the environment when a command needs the
# secret, not at load time. Any other string that is exactly a ${env:NAME}
# reference is resolved from the environment at load time.

# Thresholds and concurrency limits. Every key is optional; the values below
# are the defaults.
[policy]
arp_active_within_days = 7.0
arp_stale_after_days = 30.0
last_seen_active_within_days = 7.0
last_seen_stale_after_days = 30.0
quarantine_min_stale_runs = 3
max_concurrent_probes_per_site = 32  # capped at 64
max_concurrent_sites = 4

# History retention limits, read only by `sot-validator history-prune --config`.
# Both keys are optional; leaving them out disables pruning. Nothing is pruned
# automatically: runs older than max_age_days, or beyond the newest
# max_runs_per_site runs of every site they cover, are deleted only by
# `history-prune --apply`.
[retention]
max_age_days = 365
max_runs_per_site = 52

# At least one site is required. block must be a 10.x.0.0/16; each active
# subnet must be a /24 inside that block.
[[sites]]
site_id = "site-001"
name = "Headquarters"
block = "10.1.0.0/16"
active_subnets = ["10.1.10.0/24", "10.1.20.0/24"]

[[sites]]
site_id = "site-002"
name = "Branch Office"
block = "10.2.0.0/16"
active_subnets = ["10.2.10.0/24", "10.2.30.0/24"]

[[vcenters]]
name = "vc-primary"
host = "vcenter01.example.invalid"
username = "svc-sot-readonly@vsphere.local"
password = "${env:SOT_VCENTER_PASSWORD}"
verify_tls = true

[[snmp_profiles]]
name = "extreme-and-apc"
version = "v2c"
community = "${env:SOT_SNMP_COMMUNITY}"

[[proxmox]]
name = "pve-lab"
host = "10.1.10.50"
port = 8006
token_id = "sot-validator@pve!readonly"
token_secret = "${env:SOT_PROXMOX_TOKEN_SECRET}"
verify_tls = true

# Weekly change digest delivery, read only by `sot-validator --config <file>
# digest ... --send`. The whole section is optional; without --send the digest
# command only renders and never reads it. policy is "on_change" (default:
# send only when a category has new items) or "always".
[digest]
policy = "on_change"

# At most one SMTP target. STARTTLS is required unless host is localhost or a
# loopback IP and allow_insecure_localhost = true. username / password are
# optional ${env:NAME} secrets (set both or neither); the sink reads them only
# when it sends.
[digest.smtp]
host = "smtp.example.invalid"
port = 587
sender = "sot-validator@example.invalid"
recipients = ["network-ops@example.invalid"]
starttls = true
allow_insecure_localhost = false
timeout_seconds = 10
subject = "SoT weekly change digest"
username = "${env:SOT_DIGEST_SMTP_USER}"
password = "${env:SOT_DIGEST_SMTP_PASSWORD}"

# Any number of webhooks, each POSTed {source, event_type, text} JSON. The URL
# is a secret: it must be a ${env:NAME} reference, and `digest --send` reveals
# and checks it (http/https with a host, no whitespace) before sending.
[[digest.webhooks]]
name = "ops-chat"
url = "${env:SOT_DIGEST_WEBHOOK_URL}"
timeout_seconds = 10
